<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Celtic Cross overlap comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #e9e4da; color: #202034; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }

    figcaption { margin-bottom: 12px; font-weight: 650; text-align: center; }
    img { display: block; width: 402px; height: 874px; object-fit: contain; object-position: top; background: #f5f0e8; border-radius: 12px; }

<body>
  <h1>Celtic Cross detail — overlap comparison</h1>

    <figure>
      <figcaption>Before · reported overlap</figcaption>

    <figure>
      <figcaption>After · final 402×874 layout</figcaption>
      <img src="46-celtic-outcome-detail-ja-light-402x874-final.png" alt="Final layout with the selected result, detail panel and actions separated" />
